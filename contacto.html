<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Gamer - Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" aria-label="Navegación principal">
      <div class="container">
        <a class="navbar-brand" href="index.html">Tienda<span>Gamer</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#catalogo">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link" href="react/index.html"><i class="bi bi-gear-fill"></i> Panel React</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="text-center mb-5">
      <p class="eyebrow">Contacto</p>
      <h1>¿Necesitas ayuda?</h1>
    </div>

    <div class="row g-4">
      <!-- Datos de contacto -->
      <section class="col-md-5" aria-labelledby="tituloInfo">
        <div class="card contact-card h-100">
          <div class="card-body p-4">
            <h2 id="tituloInfo" class="h5 mb-4">Información</h2>
            <p><i class="bi bi-envelope-fill me-2"></i> contacto@tiendagamer.cl</p>
            <p><i class="bi bi-telephone-fill me-2"></i> +56 9 1234 5678</p>
            <p><i class="bi bi-clock-fill me-2"></i> Lunes a sábado, 10:00 - 20:00</p>
          </div>
        </div>
      </section>

      <!-- Formulario: se valida con JavaScript (assets/js/contacto.js) -->
      <section class="col-md-7" aria-labelledby="tituloForm">
        <div class="card contact-card">
          <div class="card-body p-4">
            <h2 id="tituloForm" class="h5 mb-3">Envíanos un mensaje</h2>

            <form id="formContacto" novalidate>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" name="nombre" type="text" class="form-control" autocomplete="name" placeholder="Tu nombre">
                <div class="invalid-feedback" id="errorNombre"></div>
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input id="correo" name="correo" type="email" class="form-control" autocomplete="email" placeholder="nombre@correo.cl">
                <div class="invalid-feedback" id="errorCorreo"></div>
              </div>

              <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea id="mensaje" name="mensaje" class="form-control" rows="4" placeholder="Cuéntanos en qué podemos ayudarte"></textarea>
                <div class="invalid-feedback" id="errorMensaje"></div>
              </div>

              <button class="btn btn-gamer" type="submit">Enviar mensaje</button>
              <div id="respuestaFormulario" class="mt-3" role="status" aria-live="polite"></div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="py-4">
    <div class="container text-center">
      <p class="mb-2">Tienda de Videojuegos Gamer - 2026</p>
      <nav aria-label="Enlaces del pie de página" class="d-flex justify-content-center gap-3">
        <a href="index.html">Inicio</a>
        <a href="contacto.html">Contacto</a>
        <a href="react/index.html">Panel React</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/contacto.js"></script>
</body>
</html>
